plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No Yarn — Minecraft 26.1 is unobfuscated, loom doesn't remap.
    // Use standard implementation (not modImplementation — that's for the old remapping loom)
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation 'com.google.code.gson:gson:2.10.1'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// No remapJar — 26.1 is unobfuscated, standard jar task is sufficient
// Loom's sourceSets already defines 'main' and 'client' — just need to
// make sure the client source set can see main's classes + MC deps.
sourceSets {
    client {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

jar {
    from sourceSets.main.output
    from sourceSets.client.output
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

task printVersion {
    doLast {
        println "Building sydran-maps for Minecraft ${project.minecraft_version}"
        println "  Loader:       ${project.loader_version}"
        println "  Fabric API:   ${project.fabric_version}"
        println "  Mappings:      Mojang official (unobfuscated — no Yarn)"
        println "  Java target:  25"
        println "  Loom:         1.15.5"
        println "  Gradle:       9.4.0"
    }
}
build.dependsOn printVersion
