plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

// ── Build variants ───────────────────────────────────────────────────
// The mod supports both Minecraft 1.21.x (current) and 26.1.x (future).
// Switch versions by changing the four properties at the top of
// gradle.properties, OR by passing them on the command line:
//
//   ./gradlew build -Pminecraft_version=26.1.2 -Pyarn_mappings=26.1.2+build.1 \
//     -Ploader_version=0.17.0 -Pfabric_version=0.110.0+26.1.2
//
// Version numbers for any MC version: https://fabricmc.net/develop/

def mcVersion = project.hasProperty('mcVersion') ? project.mcVersion : project.minecraft_version
def yarnVersion = project.hasProperty('yarnVersion') ? project.yarnVersion : project.yarn_mappings
def loaderVer = project.hasProperty('loaderVer') ? project.loaderVer : project.loader_version
def fabricVer = project.hasProperty('fabricVer') ? project.fabricVer : project.fabric_version

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings "net.fabricmc:yarn:${yarnVersion}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loaderVer}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricVer}"
    implementation 'com.google.code.gson:gson:2.10.1'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Print which MC version we're building for
task printVersion {
    doLast {
        println "Building sydran-maps for Minecraft ${mcVersion}"
        println "  Yarn:      ${yarnVersion}"
        println "  Loader:    ${loaderVer}"
        println "  Fabric API: ${fabricVer}"
    }
}
build.dependsOn printVersion
